# Local development infrastructure for Briefly AI.
#
# Runs only the stateful dependencies (MongoDB and Redis). The React app,
# Express API, BullMQ worker and FastAPI service run directly on the host
# so you get fast reloads and native debugging.
#
#   Start:  docker compose up -d
#   Status: docker compose ps
#   Logs:   docker compose logs -f
#   Stop:   docker compose down          (keeps data volumes)
#   Reset:  docker compose down -v       (DELETES local data)
#
# Ports are bound to 127.0.0.1 so the databases are not reachable from
# other machines on your network.

name: briefly-ai

services:
  mongodb:
    image: mongo:7.0
    container_name: briefly-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: briefly_ai
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: briefly-redis
    restart: unless-stopped
    # BullMQ requires the "noeviction" policy so queued jobs are never evicted.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  mongodb_data:
  redis_data:
